
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lost Adventure</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: linear-gradient(#080d39, #342078);
  min-height: 100vh;
}

h1 {
  font-size: 25px;
  margin: 12px 0;
  text-shadow: 0 0 12px #a58aff;
}

.world {
  display: inline-block;
  padding: 9px 20px;
  border: 2px solid #9d8aff;
  border-radius: 30px;
  background: #241455;
  color: #e2caff;
  font-weight: bold;
}

.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  max-width: 600px;
  margin: 17px auto 9px;
  font-size: 13px;
}

.hud span {
  background: #19134e;
  border: 1px solid #9784ff;
  border-radius: 14px;
  padding: 10px;
}

#game {
  position: relative;
  width: 100%;
  max-width: 600px;
  height: 330px;
  margin: auto;
  overflow: hidden;
  border: 3px solid #8c77f7;
  border-radius: 15px;
  background: linear-gradient(
    #091449 0%,
    #38208c 50%,
    #a35bc4 100%
  );
  touch-action: none;
}

.moon {
  position: absolute;
  right: 16%;
  top: 25px;
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: #fff0d8;
  box-shadow: 0 0 35px 14px #d8b8ff;
}

.stars {
  position: absolute;
  inset: 0;
  color: #fff7c0;
  font-size: 13px;
  letter-spacing: 15px;
  line-height: 43px;
  opacity: .85;
}

.castle {
  position: absolute;
  right: 9%;
  bottom: 41px;
  font-size: 75px;
  opacity: .65;
  filter: drop-shadow(0 0 12px #b48cff);
}

.mushroom {
  position: absolute;
  bottom: 39px;
  font-size: 43px;
  filter: drop-shadow(0 0 9px #f46bff);
}

#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 42px;
  background: linear-gradient(#49e4b0 0 8px, #27356a 8px);
  box-shadow: 0 -5px 13px #58ffdc;
  z-index: 3;
}

#player {
  position: absolute;
  left: 20px;
  bottom: 42px;
  width: 30px;
  height: 39px;
  background: #ff9859;
  border: 3px solid #55316d;
  border-radius: 10px 10px 7px 7px;
  z-index: 5;
}

#player::before {
  content: "•  •";
  position: absolute;
  top: 5px;
  left: 5px;
  color: #392045;
  font-size: 13px;
  white-space: nowrap;
}

.crystal {
  position: absolute;
  font-size: 27px;
  z-index: 4;
  filter: drop-shadow(0 0 8px cyan);
  animation: glow 1.3s infinite alternate;
}

@keyframes glow {
  from { filter: drop-shadow(0 0 3px cyan); }
  to { filter: drop-shadow(0 0 13px cyan); }
}

.controls {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin: 19px auto;
}

button {
  width: 78px;
  height: 65px;
  font-size: 29px;
  color: #c6e8ff;
  background: #16144c;
  border: 2px solid #9482ff;
  border-radius: 18px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

button:active { background: #5945ae; }

#message {
  min-height: 26px;
  color: #bdfdf5;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🌿 The Lost Adventure 🌙</h1>
<div class="world">World 1 — Moonlight Kingdom</div>

<div class="hud">
  <span>Level 1: The Moonlit Path</span>
  <span id="score">💎 0 / 5</span>
</div>

<div id="game">
  <div class="stars">
    ✦ ✧ ⋆ ✦ ✧ ⋆ ✦ ✧ ⋆ ✦ ✧
    ⋆ ✦ ✧ ⋆ ✦ ✧ ⋆ ✦ ✧
  </div>

  <div class="moon"></div>
  <div class="castle">🏰</div>

  <div class="mushroom" style="left:3%">🍄</div>
  <div class="mushroom" style="left:75%">🍄</div>

  <div id="ground"></div>
  <div id="player"></div>
</div>

<div class="controls">
  <button id="left">◀</button>
  <button id="jump">⬆</button>
  <button id="right">▶</button>
</div>

<p id="message">✨ Collect all 5 Moon Crystals!</p>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

let x = 20;
let y = 0;
let velocityY = 0;
let direction = 0;
let score = 0;
let finished = false;

const speed = 3;
const gravity = 0.55;
const jumpPower = 11;

// Positions adapt to iPhone screen width.
const crystalData = [
  [0.15, 47],
  [0.32, 91],
  [0.49, 48],
  [0.67, 91],
  [0.85, 48]
];

const crystals = crystalData.map(([fraction, height]) => {
  const element = document.createElement("div");
  element.className = "crystal";
  element.textContent = "💎";

  const cx = fraction * (game.clientWidth - 28);

  element.style.left = cx + "px";
  element.style.bottom = height + "px";
  game.appendChild(element);

  return {
    element: element,
    fraction: fraction,
    height: height,
    collected: false
  };
});

function jumpNow() {
  if (y === 0 && !finished) {
    velocityY = jumpPower;
  }
}

function update() {
  if (finished) return;

  x += direction * speed;
  x = Math.max(
    0,
    Math.min(x, game.clientWidth - player.offsetWidth)
  );

  velocityY -= gravity;
  y += velocityY;

  if (y < 0) {
    y = 0;
    velocityY = 0;
  }

  player.style.left = x + "px";
  player.style.bottom = (42 + y) + "px";

  const pLeft = x;
  const pRight = x + 30;
  const pBottom = 42 + y;
  const pTop = pBottom + 39;

  crystals.forEach(crystal => {
    if (crystal.collected) return;

    const cx = crystal.fraction *
      (game.clientWidth - 28);

    crystal.element.style.left = cx + "px";

    const touching =
      pRight > cx &&
      pLeft < cx + 27 &&
      pTop > crystal.height &&
      pBottom < crystal.height + 27;

    if (touching) {
      crystal.collected = true;
      crystal.element.remove();
      score++;

      scoreText.textContent = "💎 " + score + " / 5";

      if (score === 5) {
        finished = true;
        direction = 0;
        message.textContent =
          "🎉 Moonlight Mission Complete!";
      }
    }
  });

  requestAnimationFrame(update);
}

function moveButton(id, value) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    direction = value;
  });

  function stop() {
    if (direction === value) direction = 0;
  }

  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
}

moveButton("left", -1);
moveButton("right", 1);

document.getElementById("jump")
  .addEventListener("pointerdown", e => {
    e.preventDefault();
    jumpNow();
  });

// Keyboard controls also work.
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") direction = -1;
  if (e.key === "ArrowRight") direction = 1;
  if (e.key === "ArrowUp" || e.key === " ") jumpNow();
});

document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" && direction === -1)
    direction = 0;
  if (e.key === "ArrowRight" && direction === 1)
    direction = 0;
});

update();
</script>

</body>
</html>
