
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Lost Adventure</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #dff5ff;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #245c35;
  font-size: 25px;
}

#game {
  position: relative;
  width: 100%;
  max-width: 600px;
  height: 320px;
  margin: auto;
  background: linear-gradient(#75caff, #e5faff);
  overflow: hidden;
  border: 3px solid #245c35;
  border-radius: 12px;
}

#player {
  position: absolute;
  width: 35px;
  height: 45px;
  background: #ff7043;
  border: 3px solid #333;
  border-radius: 12px;
  bottom: 40px;
  left: 30px;
  z-index: 2;
}

#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 40px;
  background: #54a447;
  border-top: 8px solid #347b35;
}

.controls {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 18px;
}

.controls button {
  width: 75px;
  height: 65px;
  font-size: 27px;
  border: none;
  border-radius: 15px;
  background: #245c35;
  color: white;
  touch-action: none;
  user-select: none;
}

.controls button:active {
  background: #ff9800;
}
</style>
</head>

<body>

<h1>🌿 The Lost Adventure 🌿</h1>

<p>Level 1: Green Forest</p>

<div id="game">
  <div id="ground"></div>
  <div id="player"></div>
</div>

<div class="controls">
  <button id="left">◀</button>
  <button id="jump">⬆</button>
  <button id="right">▶</button>
</div>

<p>Move your character and jump!</p>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");

let x = 30;
let y = 0;
let velocityY = 0;
let direction = 0;

const gravity = 0.6;
const jumpPower = 11;
const speed = 3;

function update() {

  x += direction * speed;

  const maxX = game.clientWidth - player.offsetWidth;

  x = Math.max(0, Math.min(x, maxX));

  velocityY -= gravity;
  y += velocityY;

  if (y <= 0) {
    y = 0;
    velocityY = 0;
  }

  player.style.left = x + "px";
  player.style.bottom = (40 + y) + "px";

  requestAnimationFrame(update);
}

function jump() {
  if (y === 0) {
    velocityY = jumpPower;
  }
}

function bindMove(id, value) {

  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    direction = value;
  });

  function stop() {
    if (direction === value) direction = 0;
  }

  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
}

bindMove("left", -1);
bindMove("right", 1);

document.getElementById("jump").addEventListener(
  "pointerdown",
  e => {
    e.preventDefault();
    jump();
  }
);

update();

</script>

</body>
</html>
