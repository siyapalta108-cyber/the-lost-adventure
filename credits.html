
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Credits | The Lost Adventure</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Georgia, serif;
  text-align: center;
  color: white;

  background:
    linear-gradient(#09091bd9, #211343ee),
    url("AD97BCFE-D54A-43C9-B322-980E6873B72C.png")
    center/cover;
}

.card {
  width: 100%;
  max-width: 440px;
  padding: 30px 20px;
  border: 2px solid #f5d995;
  border-radius: 25px;
  background: #171237dc;
  box-shadow: 0 0 35px #b68aff88;
  animation: appear 1s ease-out;
}

.star {
  font-size: 45px;
  animation: glow 1.5s infinite alternate;
}

h1 {
  color: #ffe4a1;
  font-size: 29px;
}

h2 {
  color: #e1c7ff;
  font-size: 21px;
}

p {
  color: #eee4ff;
  line-height: 1.8;
}

.name {
  font-size: 28px;
  color: #ffe4a1;
  font-weight: bold;
  text-shadow: 0 0 12px #c18aff;
}

a {
  display: block;
  margin-top: 22px;
  padding: 16px;
  border: 1px solid #ffe4a1;
  border-radius: 30px;
  background: linear-gradient(90deg, #6945c3, #a778e8);
  color: white;
  text-decoration: none;
  font-weight: bold;
}

@keyframes glow {
  from {
    filter: drop-shadow(0 0 3px #fff);
  }
  to {
    filter: drop-shadow(0 0 20px #d7aaff);
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>

<body>

<main class="card">

  <div class="star">🌙✨⭐</div>

  <h1>THE LOST ADVENTURE</h1>

  <h2>Game Credits</h2>

  <p>Created By</p>

  <div class="name">Mehak 💜</div>

  <p>
    A magical journey through
    ten enchanted worlds.
  </p>

  <p>⭐ Nova — The Star Explorer ⭐</p>

  <p>
    Thank you for playing and bringing
    the light back to Moonlight Kingdom!
  </p>

  <div class="star">🏰💎🌙</div>

  <a href="menu.html">
    ← BACK TO MAIN MENU
  </a>

</main>

</body>
</html>
