
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Lost Adventure | Mehak</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 min-height:100dvh;
 padding:25px 20px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Georgia,serif;
 text-align:center;
 color:white;
 background:
 radial-gradient(circle at 50% 20%,#63449b,#211744 50%,#080b22);
}

.menu{
 width:100%;
 max-width:440px;
 padding:30px 20px;
 border:2px solid #e9c986;
 border-radius:25px;
 background:#171236cc;
 box-shadow:0 0 35px #a16aff77;
}

.moon{
 font-size:55px;
 animation:glow 2s infinite alternate;
}

h1{
 color:#ffe3a1;
 font-size:37px;
 line-height:1.2;
 text-shadow:0 0 18px #b68aff;
}

.subtitle{
 color:#e4d3ff;
 line-height:1.7;
 margin-bottom:30px;
}

.btn{
 display:block;
 width:100%;
 margin-top:15px;
 padding:17px 10px;
 border:2px solid #e9ca88;
 border-radius:25px;
 background:linear-gradient(90deg,#56379c,#9465d4);
 color:white;
 text-decoration:none;
 font:bold 16px Georgia,serif;
 cursor:pointer;
}

.primary{
 background:linear-gradient(90deg,#936029,#b18a4c,#6240a7);
 box-shadow:0 0 18px #f5c66a55;
}

.footer{
 margin-top:30px;
 color:#d9c5ff;
 font-size:14px;
}

@keyframes glow{
 from{filter:drop-shadow(0 0 5px #fff)}
 to{filter:drop-shadow(0 0 22px #d7aaff)}
}
</style>
</head>

<body>

<main class="menu">

<div class="moon">🌙✨</div>

<h1>The Lost Adventure</h1>

<p class="subtitle">
Find the Moon Crystals<br>
Save the Kingdom
</p>

<a class="btn primary" href="character.html">
✦ START GAME ✦
</a>

<a class="btn" href="nova-game-v2.html">
🎮 CONTINUE ADVENTURE
</a>

<a class="btn" href="how-to-play.html">
📖 HOW TO PLAY
</a>

<a class="btn" href="credits.html">
⭐ GAME CREDITS
</a>

<button class="btn" id="musicButton" onclick="toggleMusic()">
🎵 PLAY MUSIC
</button>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="footer">
Created by Mehak 💜<br>
Moonlight Kingdom
</div>

</main>

<script>
const music=document.getElementById("music");
const musicButton=document.getElementById("musicButton");

function toggleMusic(){
 if(music.paused){
  music.play().then(()=>{
   musicButton.textContent="⏸ PAUSE MUSIC";
  }).catch(()=>{
   musicButton.textContent="🎵 MUSIC UNAVAILABLE";
  });
 }else{
  music.pause();
  musicButton.textContent="🎵 PLAY MUSIC";
 }
}
</script>

</body>
</html>
