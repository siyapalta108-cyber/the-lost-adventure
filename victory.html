
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova's Victory | The Lost Adventure</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100dvh;
  padding:25px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  font-family:Georgia,serif;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 50% 25%,#6944a5,#17153f 55%,#08091e);
}

.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.stars span{
  position:absolute;
  font-size:25px;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.25;transform:scale(.6)}
  to{opacity:1;transform:scale(1.3)}
}

.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:440px;
  padding:24px 18px;
  border:2px solid #ffe3a1;
  border-radius:25px;
  background:#171237dc;
  box-shadow:0 0 35px #b18aff88;
}

h1{
  font-size:29px;
  color:#ffe4a1;
  text-shadow:0 0 15px #e6ba60;
}

.nova{
  width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:16px;
}

h2{color:#e6c8ff}

p{
  line-height:1.7;
  color:#eee4ff;
}

button,.link{
  display:block;
  width:100%;
  margin-top:13px;
  padding:15px;
  border:1px solid #f5d794;
  border-radius:30px;
  background:linear-gradient(90deg,#6945c3,#a778e8);
  color:white;
  font-size:16px;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}

.link{
  background:#27234f;
}

.trophy{
  font-size:45px;
  animation:twinkle 1.5s infinite alternate;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<main class="card">

<div class="trophy">🏆✨</div>

<h1>VICTORY!</h1>

<img
  class="nova"
  src="93E3387E-BC6C-4B72-8022-3C990C9B9F27.png"
  alt="Nova the Star Explorer"
>

<h2>Nova Restored the Moonlight Kingdom!</h2>

<p>
Through ten enchanted worlds, Nova collected
the lost Moon Crystals and brought their
magical light back to the kingdom.
</p>

<p>🌙 The stars shine again. The adventure is complete! ⭐</p>

<button onclick="location.href='character.html'">
✨ PLAY AGAIN
</button>

<a class="link" href="menu.html">
← MAIN MENU
</a>

</main>

<script>
const stars=document.getElementById("stars");

for(let i=0;i<28;i++){
  const star=document.createElement("span");
  star.textContent=i%3===0?"✦":"✧";
  star.style.left=Math.random()*100+"%";
  star.style.top=Math.random()*100+"%";
  star.style.animationDelay=Math.random()*2+"s";
  star.style.color=i%2===0?"#ffe7a1":"#d5baff";
  stars.appendChild(star);
}
</script>

</body>
</html>
