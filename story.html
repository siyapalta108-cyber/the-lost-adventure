
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova's Story | The Lost Adventure</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100dvh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 linear-gradient(#08091dcc,#171033ee),
 url("AD97BCFE-D54A-43C9-B322-980E6873B72C.png")
 center/cover;
 color:white;
 font-family:Georgia,serif;
 text-align:center;
}

.story{
 width:100%;
 max-width:470px;
 padding:28px 20px;
 border:2px solid #d6b77d;
 border-radius:22px;
 background:#151235d9;
 box-shadow:0 0 35px #8b67e077;
}

.star{
 font-size:40px;
 animation:glow 2s infinite alternate;
}

h1{
 color:#ffe5a2;
 font-size:29px;
}

h2{
 color:#d6baff;
 font-size:18px;
}

p{
 line-height:1.9;
 font-size:16px;
 color:#f0eaff;
}

button{
 width:100%;
 padding:16px;
 margin-top:20px;
 border:2px solid #f8d98b;
 border-radius:30px;
 background:linear-gradient(90deg,#6242bb,#a26ee5);
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

@keyframes glow{
 from{filter:drop-shadow(0 0 3px #fff)}
 to{filter:drop-shadow(0 0 20px #d2aaff)}
}

</style>
</head>

<body>

<div class="story">

<div class="star">🌙✨</div>

<h1>The Lost Adventure</h1>
<h2>Nova's Story</h2>

<p>
Once upon a time, the Moonlight Kingdom
shone with ten magical crystals.
</p>

<p>
But one night, darkness scattered their
light across ten enchanted worlds.
</p>

<p>
Nova, the Star Explorer, was chosen
to bring the light home.
</p>

<p>
Her journey begins tonight...
</p>

<button onclick="location.href='index.html'">
✨ START ADVENTURE
</button>

</div>

</body>
</html>
